name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    # Windows: the app ships Windows-only and check-jail asserts Windows path rules.
    runs-on: windows-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
